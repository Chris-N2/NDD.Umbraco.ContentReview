# Unattended verification of every push and pull request.
#
# A green run means the solution (backoffice client included) built from a clean checkout with
# warnings as errors, and that every test project demonstrably ran with nothing skipped:
# scripts/ci/Assert-TestResults.ps1 fails the run otherwise.
#
# Third-party actions are pinned to full commit SHAs; the tag in the trailing comment is what the
# SHA was resolved from. Update both together. WorkflowTests enforces the pinning.

name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per ref; a newer push to the same ref replaces a superseded run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      # Warnings are errors (Directory.Build.props); `CI=true dotnet build` reproduces this locally
      CI: 'true'
      CLIENT_DIR: src/NDD.Umbraco.ContentReview.Backoffice/Client
      RESULTS_DIR: ${{ github.workspace }}/../test-results

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/NDD.Umbraco.ContentReview.Backoffice/Client/package-lock.json

      - name: Client - install
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm ci

      - name: Build (Release; warnings are errors because CI=true)
        # The Backoffice project builds the client itself and adds it to static web assets
        run: dotnet build NDD.Umbraco.ContentReview.slnx --configuration Release

      - name: Test
        run: >-
          dotnet test NDD.Umbraco.ContentReview.slnx
          --configuration Release
          --no-build
          --logger trx
          --results-directory "${{ env.RESULTS_DIR }}"

      - name: Every suite ran, nothing skipped
        # Runs even when tests failed, so a run that failed AND lost a suite says both
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/ci/Assert-TestResults.ps1 -ResultsDirectory "${{ env.RESULTS_DIR }}"
